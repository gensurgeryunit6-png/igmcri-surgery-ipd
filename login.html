<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGMCRI Surgery IPD — Sign in</title><style>body{margin:0;background:#eef3f8;font-family:Segoe UI,Arial,sans-serif;color:#172033;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,90vw);background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 35px #0002}h1{font-size:20px;margin:0 0 5px;color:#17365d}.sub{color:#667085;font-size:13px;margin-bottom:22px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfd8e3;border-radius:8px;font-size:15px}.btn{width:100%;border:0;border-radius:8px;padding:12px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.msg{margin-top:12px;padding:10px;border-radius:8px;background:#fff1f0;color:#b42318;font-size:13px;display:none}.note{margin-top:18px;color:#667085;font-size:11px;line-height:1.5}</style></head><body><main class="box"><h1>IGMCRI — Department of General Surgery</h1><div class="sub">Inpatient Department Management System</div><form id="f"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required placeholder="Staff email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Password"></div><button class="btn">Sign in</button><div id="msg" class="msg"></div></form><div class="note">Access is restricted to active IGMCRI Surgery staff accounts. Patient data is protected by Supabase Row Level Security.</div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://pnncnljakqrqzocahxhs.supabase.co','sb_publishable_cga5rEYY_gFG3KZ2Kpvb9g_ZoHKiYJd');const msg=document.getElementById('msg');const show=x=>{msg.textContent=x;msg.style.display='block'};const {data:{session}}=await db.auth.getSession();if(session)location.replace('./');document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';const{data,error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return show(error.message);const{data:profile,error:pe}=await db.from('staff_profiles').select('id,name,designation,unit,role,active').eq('user_id',data.user.id).eq('active',true).maybeSingle();if(pe||!profile){await db.auth.signOut();return show('Your account is not registered as active IPD staff.');}location.replace('./');});</script></body></html>
